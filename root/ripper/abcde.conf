# abcde configuration

# Encode tracks immediately after reading.
LOWDISK=y

# CD metadata
CDDBMETHOD=cddb
CDDBURL="http://gnudb.gnudb.org/~cddb/cddb.cgi"

# Local CDDB cache
CDDBCOPYLOCAL=y
CDDBLOCALDIR="$HOME/.cddb"
CDDBLOCALRECURSIVE=y
CDDBUSELOCAL=y

# FLAC
FLACENCODERSYNTAX=flac
FLAC=flac
FLACOPTS='-s -e -V -8'
OUTPUTTYPE="flac"

# CD reader
CDROMREADERSYNTAX=cdparanoia
CDPARANOIA=cdparanoia
CDPARANOIAOPTS="--never-skip=40"
CDDISCID=cd-discid

# Output
OUTPUTDIR="${STORAGE_CD:-/out/Ripper/CD}"

# Actions
ACTIONS=cddb,playlist,read,encode,tag,move,clean

# Uncomment to fetch/embed album artwork
# ACTIONS=cddb,playlist,read,getalbumart,encode,tag,move,clean

# Output naming
OUTPUTFORMAT='${ARTISTFILE}-${ALBUMFILE}/${TRACKNUM}.${TRACKFILE}'
VAOUTPUTFORMAT='Various-${ALBUMFILE}/${TRACKNUM}.${ARTISTFILE}-${TRACKFILE}'

ONETRACKOUTPUTFORMAT='${ARTISTFILE}-${ALBUMFILE}/${ALBUMFILE}'
VAONETRACKOUTPUTFORMAT='Various-${ALBUMFILE}/${ALBUMFILE}'

# Playlists
PLAYLISTFORMAT='${ARTISTFILE}-${ALBUMFILE}/${ALBUMFILE}.m3u'
VAPLAYLISTFORMAT='Various-${ALBUMFILE}/${ALBUMFILE}.m3u'

# Remove characters unsuitable for filenames
mungefilename ()
{
    echo "$@" | sed -e 's/^\.*//' | tr -d ":><|*/\"'?[:cntrl:]"
}

# Embed album artwork into FLAC files
post_encode ()
{
    ARTISTFILE="$(mungefilename "$TRACKARTIST")"
    ALBUMFILE="$(mungefilename "$DALBUM")"

    if [ "$VARIOUSARTISTS" = "y" ]; then
        FINDPATH="$(eval echo "$VAOUTPUTFORMAT")"
    else
        FINDPATH="$(eval echo "$OUTPUTFORMAT")"
    fi

    FINALDIR="$(dirname "$OUTPUTDIR/$FINDPATH")"

    cd "$FINALDIR" || return 1

    if [ -e "cover.jpg" ]; then
        metaflac --import-picture-from=cover.jpg ./*.flac
    else
        vecho "Cover image not found..." >&2
        return 1
    fi

    vecho "Album art embedded in FLAC files." >&2

    find "$FINALDIR" -type f -exec chown "$FILEUSER:$FILEGROUP" {} +
    find "$FINALDIR" -type f -exec chmod "$FILEMODE" {} +

    return 0
}

# Processing
MAXPROCS=2
PADTRACKS=y
EXTRAVERBOSE=2
COMMENT='abcde version 2.9.3'
EJECTCD=y
INTERACTIVE=n

# EYED3OPTS="--non-std-genres"
