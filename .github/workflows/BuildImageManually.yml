name: Build Image with MakeMKV from manual build

on:
  push:
    paths-ignore:
      - 'latest/**'
  workflow_dispatch:

env:
  ENDPOINT: "rix1337/docker-ripper"

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      output: ${{ steps.get-version.outputs.version }}
    steps:
      - id: get-version
        run: |
          VERSION=$(curl --silent 'https://forum.makemkv.com/forum/viewtopic.php?f=3&t=224' | grep MakeMKV.*.for.Linux.is | head -n 1 | sed -e 's/.*MakeMKV //g' -e 's/ .*//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: version-check
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERUSER }}"
          password: "${{ secrets.DOCKERPASS }}"

      - uses: docker/build-push-action@v6
        with:
          context: "./"
          file: "./manual-build/Dockerfile"
          push: true
          tags: |
            ${{ env.ENDPOINT }}:manual-latest
            ${{ env.ENDPOINT }}:${{ needs.version-check.outputs.output }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
