name: Build Images

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    paths:
      - '**'
      - '!README.md'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target build (manual, ppa [amd64 and arm64], all)'
        required: false
        default: 'all'
        type: choice
        options:
        - manual
        - ppa
        - all

env:
  ENDPOINT: "rix1337/docker-ripper"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      manual: ${{ steps.filter.outputs.manual }}
      latest: ${{ steps.filter.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            manual:
              - '**'
              - '!latest/**'
            latest:
              - '**'
              - '!manual-build/**'

  version-check-manual:
    needs: changes
    if: ${{ inputs.target == 'manual' || inputs.target == 'all' || (inputs.target == null && github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && needs.changes.outputs.manual == 'true') }}
    runs-on: ubuntu-latest
    outputs:
      output: ${{ steps.get-version.outputs.version }}
    steps:
      - id: get-version
        run: |
          VERSION=$(curl --silent 'https://forum.makemkv.com/forum/viewtopic.php?f=3&t=224' | grep MakeMKV.*.for.Linux.is | head -n 1 | sed -e 's/.*MakeMKV //g' -e 's/ .*//g')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  # -----------------------------------------------------------------------
  # MANUAL BUILD (AMD64 only)
  # -----------------------------------------------------------------------
  build-manual:
    needs: [changes, version-check-manual]
    if: ${{ inputs.target == 'manual' || inputs.target == 'all' || (inputs.target == null && github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && needs.changes.outputs.manual == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERUSER }}"
          password: "${{ secrets.DOCKERPASS }}"
      - uses: docker/build-push-action@v6
        with:
          context: "./"
          file: "./manual-build/Dockerfile"
          push: true
          # Direct push of naked tags allowed here since it's single-arch
          tags: |
            ${{ env.ENDPOINT }}:manual-latest
            ${{ env.ENDPOINT }}:${{ needs.version-check-manual.outputs.output }}
          cache-from: type=gha,scope=manual
          cache-to: type=gha,mode=max,scope=manual

  # -----------------------------------------------------------------------
  # PPA BUILDS (Split into native AMD64 and ARM64 jobs)
  # -----------------------------------------------------------------------
  build-ppa-amd64:
    needs: changes
    if: ${{ inputs.target == 'ppa' || inputs.target == 'all' || (inputs.target == null && github.event_name == 'workflow_dispatch') || github.event_name == 'schedule' || (github.event_name == 'push' && needs.changes.outputs.latest == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERUSER }}"
          password: "${{ secrets.DOCKERPASS }}"
      - uses: docker/build-push-action@v6
        with:
          context: "./"
          file: "./latest/Dockerfile"
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.ENDPOINT }}:latest-amd64
            ${{ env.ENDPOINT }}:ppa-latest-amd64
          cache-from: type=gha,scope=ppa-amd64
          cache-to: type=gha,mode=max,scope=ppa-amd64

  build-ppa-arm64:
    needs: changes
    if: ${{ inputs.target == 'ppa' || inputs.target == 'all' || (inputs.target == null && github.event_name == 'workflow_dispatch') || github.event_name == 'schedule' || (github.event_name == 'push' && needs.changes.outputs.latest == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERUSER }}"
          password: "${{ secrets.DOCKERPASS }}"
      - uses: docker/build-push-action@v6
        with:
          context: "./"
          file: "./latest/Dockerfile"
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ENDPOINT }}:latest-arm64
            ${{ env.ENDPOINT }}:ppa-latest-arm64
          cache-from: type=gha,scope=ppa-arm64
          cache-to: type=gha,mode=max,scope=ppa-arm64

  # -----------------------------------------------------------------------
  # MERGE JOB (Combines PPA AMD64 + ARM64)
  # -----------------------------------------------------------------------
  merge-ppa:
    needs: [build-ppa-amd64, build-ppa-arm64]
    # Runs only if the parent jobs ran
    if: ${{ always() && needs.build-ppa-amd64.result == 'success' && needs.build-ppa-arm64.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERUSER }}"
          password: "${{ secrets.DOCKERPASS }}"
      - name: Create and Push Manifests
        run: |
          # Create :latest (Multi-arch)
          docker buildx imagetools create -t ${{ env.ENDPOINT }}:latest \
            ${{ env.ENDPOINT }}:latest-amd64 \
            ${{ env.ENDPOINT }}:latest-arm64

          # Create :ppa-latest (Multi-arch)
          docker buildx imagetools create -t ${{ env.ENDPOINT }}:ppa-latest \
            ${{ env.ENDPOINT }}:ppa-latest-amd64 \
            ${{ env.ENDPOINT }}:ppa-latest-arm64
